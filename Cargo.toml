[workspace]
members = [
    "enumset",
    "enumset_derive",
    "enumset_test",
    "enumset_test_embedded",
    "enumset_test_trybuild",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
debug = 1

[workspace.dependencies]
defmt = { version = "1" }
enumset = { version = "1", path = "enumset" }
serde = { version = "1", features = ["derive"] }
